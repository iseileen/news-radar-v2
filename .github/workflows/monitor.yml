name: Monitor
on:
  schedule:
    # 每天台灣時間下午2:05（cron 用的是 UTC，所以寫 6）
    - cron: "5 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
      - name: 執行雷達
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
        run: uv run radar.py
      - name: 記住看過的新聞
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "chore: 更新雷達紀錄"
          git push
